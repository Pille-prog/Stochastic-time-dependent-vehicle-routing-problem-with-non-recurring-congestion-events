# Scaled Chengdu config for ticket 08's worker sweep (never the full run).
#
# Same world and same demand/congestion/policy knobs as config.yaml; only the
# episode counts change. Where baseline_scaled.yaml is cut small enough to time
# a whole scaled experiment, this one keeps the two *parallelizable* phases wide
# enough to keep several workers busy — 32 evaluation Episodes and 8 final-test
# seeds at each of the two projection endpoints (2 and 50 actions):
#
#   uv run python scripts/benchmark_episodes.py \
#       --config experiments/chengdu/parallel_scaled.yaml \
#       --project experiments/chengdu/config.yaml \
#       --workers 1,2,3
#
# Training stays at 5 Episodes: it is sequential either way, and the sweep only
# needs a realistically trained W to evaluate with. See ticket 08 Comments.

data_dir: ../../..
links_file: link.csv
shortest_paths_file: all_shortest_paths.csv
instance_day: 601
traffic_days: [601, 602, 603, 604, 605, 606, 607, 608, 609, 610,
               611, 612, 613, 614, 615, 616, 617, 618, 619, 620,
               621, 622, 623, 624, 625, 626, 627, 628, 629, 630,
               701, 702, 703, 704, 705, 706, 707, 708, 709, 710,
               711, 712, 713, 714]

horizon_start_minute: 300
shift_end_minute: 780
episode_end_minute: 1150

mean_number_clients: 150
client_count_stddev: 30.0
min_number_clients: 60
clients_per_vehicle: 28
time_window_spread: 60
client_universe_seed: 0
client_universe_size: 150
client_universe_node_range: [1, 1900]

congestion_lower_bound: 0.3
congestion_upper_bound: 0.4
max_congestion_duration: 120

total_train_iterations: 5
test_frequency: 5
learning_rate: 1.0e-5
warmup_learning_rate: 1.0e-6
epsilon: 0.1
n_observed_velocities: 3
first_train_seed: 1000
evaluation_seed_start: 100000
evaluation_seed_count: 32
test_episodes: 1

# The two projection endpoints; the full config's middle action counts are
# interpolated between them (scripts/benchmark_episodes.py).
test_action_counts: [2, 50]
test_seeds: [100, 101, 102, 103, 104, 105, 106, 107]
test_vehicle_counts: [6, 5, 5, 7, 7, 6, 6, 5]

static_policy_mean_cost: 2490
