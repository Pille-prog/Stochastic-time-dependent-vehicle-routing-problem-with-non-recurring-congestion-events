[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stdvrp"
version = "0.1.0"
description = "Stochastic time-dependent vehicle routing with non-recurring congestion events: simulation and policy-optimization laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    # Ticket 07 (neural-policy): the live paired report's Wilcoxon signed-rank
    # test against the reference card. Generic Trainer reporting infra, not
    # neural-specific, so it is a core dependency rather than part of the
    # `neural` extra.
    "scipy>=1.11",
]

# Ticket 03 (neural-policy): the transformer Policy's only extra dependency. Not
# installed by default — `stdvrp.policies` stays importable without it, and the
# 4000+-test suite never touches a network. `uv sync --extra neural` to opt in.
[project.optional-dependencies]
neural = ["torch>=2.4"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

# PyPI serves the CPU-only torch build, which silently wastes any local GPU: the
# `neural` extra would install and import fine while `torch.cuda.is_available()`
# stays False. Pinning the extra to PyTorch's CUDA 12.8 index makes GPU training
# the default for anyone who opts into `neural`.
#
# `explicit = true` keeps this index out of general resolution — only packages
# routed here by [tool.uv.sources] use it, everything else stays on PyPI.
#
# CI is unaffected: `.github/workflows/ci.yml` runs a plain `uv sync`, so the
# extra is never installed there and the neural tests skip via importorskip.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# The CUDA index publishes Linux and Windows wheels only; macOS falls back to
# PyPI, where torch is CPU-only anyway (no CUDA on macOS).
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/stdvrp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/stdvrp"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

# Everything inside the package is new code: fully typed from day one.
[[tool.mypy.overrides]]
module = "stdvrp.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["networkx.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true

# torch is an optional extra (ticket 03, neural-policy): mypy must stay clean
# whether or not it is installed in the checking environment.
[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

# Strict on the new core interfaces (ADR-0002 seams and the experiment config).
# mypy does not accept `strict` per-module, so its component flags are set instead.
[[tool.mypy.overrides]]
module = ["stdvrp.config", "stdvrp.traffic.datasource"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
strict_equality = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The golden-master test needs the full local Chengdu dataset and takes minutes;
# opt in with `uv run pytest -m golden`. `neural` tests skip themselves (via
# pytest.importorskip) when torch is not installed, so they need no addopts
# exclusion — the suite is green either way.
addopts = "-m 'not golden'"
markers = [
    "golden: exact legacy golden-master equality; needs the full local dataset",
    "neural: exercises the optional torch dependency; skips cleanly if absent",
]
