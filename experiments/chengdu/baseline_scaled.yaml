# Scaled Chengdu config for ticket 01's full-run projection (never the full run).
#
# Identical to config.yaml (same world, same demand/congestion/policy knobs) but
# with the episode counts cut to ~16 real episodes so the per-phase per-episode
# means can be measured in minutes, then projected to the full-run wall-clock:
#
#   uv run python scripts/benchmark_episodes.py \
#       --config experiments/chengdu/baseline_scaled.yaml \
#       --project experiments/chengdu/config.yaml
#
# The projection multiplies these means by config.yaml's real counts (100 train,
# 500 eval, 6 action counts x 50 seeds x 50 test episodes). See ticket 01 Comments.

data_dir: ../../..
links_file: link.csv
shortest_paths_file: all_shortest_paths.csv
instance_day: 601
traffic_days: [601, 602, 603, 604, 605, 606, 607, 608, 609, 610,
               611, 612, 613, 614, 615, 616, 617, 618, 619, 620,
               621, 622, 623, 624, 625, 626, 627, 628, 629, 630,
               701, 702, 703, 704, 705, 706, 707, 708, 709, 710,
               711, 712, 713, 714]

horizon_start_minute: 300
shift_end_minute: 780
episode_end_minute: 1150

mean_number_clients: 150
client_count_stddev: 30.0
min_number_clients: 60
clients_per_vehicle: 28
time_window_spread: 60
client_universe_seed: 0
client_universe_size: 150
client_universe_node_range: [1, 1900]

congestion_lower_bound: 0.3
congestion_upper_bound: 0.4
max_congestion_duration: 120

# Scaled down from 100 / 10 / 50 / 50: 5 training episodes, one evaluation block
# of 5 seeds, and (with test_action_counts below) 2 action counts x 3 seeds x 1
# episode. ~16 real episodes total.
total_train_iterations: 5
test_frequency: 5
learning_rate: 1.0e-5
warmup_learning_rate: 1.0e-6
epsilon: 0.1
n_observed_velocities: 3
first_train_seed: 1000
evaluation_seed_start: 100000
evaluation_seed_count: 5
test_episodes: 1

# Only the two projection endpoints (2 and 50); the middle action counts of the
# full config are linearly interpolated between them.
test_action_counts: [2, 50]
test_seeds: [100, 101, 102]
test_vehicle_counts: [6, 5, 5]

# Neural policy (ticket 03): see experiments/chengdu/config.yaml's comment.
neural_d_model: 128
neural_n_layers: 3
neural_n_heads: 4
device: cpu
